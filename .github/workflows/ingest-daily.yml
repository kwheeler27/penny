name: Ingest — daily (Debt to the Penny, TGA, DTS cadence, TreasuryDirect auctions)

# Debt to the Penny, the Daily Treasury Statement TGA closing balance, and
# the Daily Treasury Statement's Deposits & Withdrawals of Operating Cash
# (atlas beat 3's cadence chart + public-debt cash issues/redemptions) all
# publish once per business day. Runs every day, including weekends — a
# run that finds nothing new is a no-op (lib/upsert.ts compares against
# the latest known value per period), which is simpler than trying to
# encode federal holidays into the schedule.
#
# The two TreasuryDirect auction steps below follow the same "run daily,
# rely on the upsert's own idempotency" shape (lib/upsert-auctions.ts) —
# resulted auctions publish results same-day (bills close for competitive
# bidding at 11:30am ET; results typically post within the hour), and the
# published calendar changes a few times a week, never on a fixed schedule.

on:
  schedule:
    # 13:00 UTC = 9:00am ET (8:00am during EDT) — safely after both
    # datasets' typical prior-business-day publication.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debt to the Penny
        working-directory: packages/ingest
        run: pnpm run ingest:debt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: TGA closing balance
        working-directory: packages/ingest
        run: pnpm run ingest:tga
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: DTS deposits & withdrawals of operating cash (cadence + public debt cash flows)
        working-directory: packages/ingest
        run: pnpm run ingest:dts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: TreasuryDirect — resulted auctions
        working-directory: packages/ingest
        run: pnpm run ingest:auctions-resulted
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: TreasuryDirect — upcoming auction calendar
        working-directory: packages/ingest
        run: pnpm run ingest:auctions-upcoming
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
