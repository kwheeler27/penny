id: fiscal.mts.outlays.category.net_interest
label: Net interest
definition: >
  The budget's net interest cost: interest paid on the public debt, netted against interest income the government receives. A different accounting concept from fiscal.debt.interest_expense_total (gross interest on the debt) — see that series' not_comparable_with.

agency: U.S. Department of the Treasury, Bureau of the Fiscal Service
dataset: Monthly Treasury Statement, Table 9 — Summary of Receipts by Source, and Outlays by Function of the U.S. Government
dataset_url: https://fiscaldata.treasury.gov/datasets/monthly-treasury-statement/outlays-of-the-u-s-government
unit: usd
magnitude: ones
accounting_concept: outlay
cadence: monthly
citation: >
  U.S. Department of the Treasury, Bureau of the Fiscal Service, Monthly Treasury Statement, Table 9, budget function 900 "Net interest". Accessed {access_date}.

revision_policy:
  status: provisional
  note: >
    Each MTS is a snapshot; a later month's report can carry a restated comparable-prior-period figure — ingest as a new observation row, never an in-place update.

notes:
  - >
    This and every other fiscal.mts.outlays.category.* series must sum to fiscal.mts.outlays.total for the same month, to the dollar — CI-enforced reconciliation (ORCHESTRATION_PROMPT.md Core flow 1).
  - >
    OMB budget function 900.
